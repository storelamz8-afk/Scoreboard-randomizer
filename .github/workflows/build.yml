name: Build RandomizerVortex

on:
  workflow_dispatch:
  push:
    paths:
      - 'RandomizerVortex-1.20.6-Source.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          
      - name: Extract source
        run: |
          unzip RandomizerVortex-1.20.6-Source.zip
          cd RandomizerVortex
          mvn clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RandomizerVortex-1.20.6
          path: RandomizerVortex/target/*.jar
